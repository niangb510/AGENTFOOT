# Redirections permanentes (301) — consolident le référencement sur niconseils.com

# Ancien sous-domaine Netlify -> nouveau nom de domaine
[[redirects]]
  from = "https://ni-conseils-managements.netlify.app/*"
  to = "https://niconseils.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ni-conseils-managements.netlify.app/*"
  to = "https://niconseils.com/:splat"
  status = 301
  force = true

# www -> domaine principal (évite le contenu dupliqué)
[[redirects]]
  from = "https://www.niconseils.com/*"
  to = "https://niconseils.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.niconseils.com/*"
  to = "https://niconseils.com/:splat"
  status = 301
  force = true

# URLs sans extension -> version .html (évite les doublons /agent et /agent.html)
[[redirects]]
  from = "/agent"
  to = "/agent.html"
  status = 301
  force = true

[[redirects]]
  from = "/players"
  to = "/players.html"
  status = 301
  force = true

[[redirects]]
  from = "/actualites"
  to = "/actualites.html"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

[[redirects]]
  from = "/article"
  to = "/article.html"
  status = 301
  force = true
